activity:
  form:
    code: Código
    code-help-text: Insira um identificador único específico para esta atividade.
    completes-order: Conclui Pedido
    details: Detalhes
    details-help-text: Forneça uma descrição detalhada da atividade para o entendimento
      do usuário final.
    key: Chave
    key-help-text: '"Insira uma chave usada para tomada de decisão programática. Esta
      chave pode representar uma ou várias atividades com o mesmo identificador. Nota:
      Esta chave não precisa ser única."'
    pod-method-placeholder: Selecione o Método de Comprovante de Entrega
    require-pod: Requer Comprovante de Entrega
    require-pod-help-text: Esta atividade requer que um comprovante seja criado antes
      que possa ser aplicada ao pedido.
    select-pod-method: Método de Comprovante de Entrega
    status: Status
    status-help-text: Especifique o status exibido para o usuário final quando esta
      atividade for acionada.
    logic-builder:
      activity-logic: Lógica da Atividade
      activity-logic-help-text: Defina condições lógicas personalizadas que determinam
        quando uma atividade fica disponível no fluxo de trabalho. Este recurso permite
        adaptar o fluxo com base em critérios específicos, garantindo que cada atividade
        seja acionada apenas quando suas condições predefinidas forem atendidas.
      activity-logic-add-logic-help-text: Crie um novo conjunto de condições que definirá
        quando uma atividade deve ser ativada. Clique aqui para começar a elaborar
        uma nova regra lógica.
      activity-logic-select-logic-type-help-text: Escolha o tipo de lógica que esta
        condição seguirá. Selecione 'Se' para uma condição direta, 'E'/'Ou' para condições
        compostas, ou 'Não' para negar uma condição.
      activity-logic-add-condition-help-text: Adicione um requisito específico que
        deve ser satisfeito dentro deste conjunto lógico. Use isso para especificar
        critérios adicionais que controlam a disponibilidade da atividade.
      field: Campo
      value: Valor
      add-logic: Adicionar Lógica
      types:
        and: 'E lógico: Verdadeiro se todas as condições forem verdadeiras'
        or: 'Ou lógico: Verdadeiro se pelo menos uma condição for verdadeira'
        not: 'Não lógico: Inverte o valor de verdade da condição'
        if: 'Lógica condicional: Executa a ação seguinte se a condição for verdadeira'
      operators:
        equal: Verifica se dois valores são iguais
        not-equal: Verifica se dois valores não são iguais
        greater-than: Verifica se um valor é maior que outro
        less-than: Verifica se um valor é menor que outro
        greater-than-or-equal: Verifica se um valor é maior ou igual a outro
        less-than-or-equal: Verifica se um valor é menor ou igual a outro
        exists: Verifica se um campo ou valor existe
        has: Verifica se um objeto possui uma propriedade específica ou se uma coleção
          contém um elemento específico
        contains: Verifica se uma string contém outra string, ou se um array inclui
          um elemento específico
        begins-with: Verifica se uma string começa com uma substring especificada
        ends-with: Verifica se uma string termina com uma substring especificada
        in: Verifica se um valor está dentro de um conjunto ou intervalo dado
        not-in: Verifica se um valor não está dentro de um conjunto ou intervalo dado
        and: E lógico, verdadeiro se ambos os operandos forem verdadeiros
        or: Ou lógico, verdadeiro se pelo menos um dos operandos for verdadeiro
        not: Não lógico, inverte o valor de verdade
    event-selector:
      activity-events: Eventos de Atividade
      activity-events-select-to-fire: Selecione quais eventos serão ativados quando
        esta atividade ocorrer.
      activity-events-select-events-info: Selecione o evento específico que deseja
        disparar em resposta a esta atividade.
      select-event-to-add: Selecione o evento para adicionar...
      events:
        order:
          dispatched: Dispara quando um pedido é despachado com sucesso.
          failed: Dispara quando um pedido falha devido a um erro ou exceção.
          canceled: Dispara quando um pedido é cancelado por um usuário, motorista
            ou processo do sistema.
          completed: Dispara quando um pedido é concluído por um motorista ou processo
            do sistema.
