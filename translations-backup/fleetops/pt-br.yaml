    intro: Escolha por quanto tempo sua organização mantém os eventos dos dispositivos
      e o histórico de posições, dentro dos limites definidos pelo administrador do
      sistema.
    use-system-default: Usar padrão do sistema
    history-policy-maximum: Seu administrador permite até {days} dias de histórico.
      Retenção ilimitada não está disponível.
    history-policy-unlimited: Seu administrador permite histórico ilimitado. Defina
      o período de retenção como 0 para manter o histórico para sempre.
    device-events: Retenção de Eventos dos Dispositivos
    event-retention-days: Manter eventos dos dispositivos por (dias)
    event-retention-days-help: Eventos mais antigos que isso são excluídos permanentemente.
      Vale tanto para atualizações de telemetria quanto para alertas do provedor.
    event-compact-after-days: Remover payloads brutos após (dias)
    event-compact-after-days-help: Eventos mais antigos que isso mantêm tipo, gravidade,
      localização e dados normalizados, mas o payload bruto do provedor é removido.
      Os payloads brutos representam a maior parte do tamanho de cada evento.
    compaction-warning: Os payloads brutos só são removidos de eventos que são mantidos.
      Defina um valor menor que a retenção de eventos ou 0 para desativar a compactação.
    positions: Retenção do Histórico de Posições
    position-retention-days: Manter posições por (dias)
    position-retention-days-help: O histórico de posições de veículos e reboques mais
      antigo que isso é excluído permanentemente. A reprodução de rotas e as telas de
      histórico só alcançam até esse limite.
    inbox: Retenção da Caixa de Entrada e das Sincronizações
    processed-retention-hours: Manter entregas processadas por (horas)
    processed-retention-hours-help: Os lotes brutos do provedor ficam armazenados criptografados
      até serem processados e são mantidos por pouco tempo para reprocessamento e diagnóstico.
      Cada lote pode ter perto de um megabyte.
    quarantine-retention-days: Manter entregas em quarentena por (dias)
    quarantine-retention-days-help: Lotes que não puderam ser processados ficam disponíveis
      para análise e reprocessamento por esse período.
    sync-run-retention-days: Manter diagnósticos de sincronização por (dias)
    sync-run-retention-days-help: Uma linha de sincronização é registrada por conexão
      a cada consulta. Sincronizações em andamento nunca são removidas.
